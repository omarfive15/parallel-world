<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adventures - Parallel World</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Adventures in the Parallel World 🚀</h1>
        <p>Interactive experiences await you!</p>
        <a href="index.html">← Back to Home</a>
    </header>
    <section class="adventure-section">
        <button id="mysteryPortal">Enter Mystery Portal</button>
        <p id="adventureText"></p>
    </section>
    <script>
        const portalBtn = document.getElementById('mysteryPortal');
        const text = document.getElementById('adventureText');
        portalBtn.addEventListener('click', () => {
            const adventures = [
                "You enter a forest where trees whisper secrets.",
                "A glowing river flows upwards defying gravity!",
                "Strange creatures approach but smile instead of harm.",
                "You find a floating island with hidden treasures."
            ];
            const randomIndex = Math.floor(Math.random() * adventures.length);
            text.innerText = adventures[randomIndex];
        });
    </script>
</body>
</html>
